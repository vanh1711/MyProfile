<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Starfield Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased text-white m-0 p-0 h-screen w-full flex flex-col overflow-hidden selection:bg-blue-500/30 bg-[#03050a] relative" style="font-family: 'Inter', sans-serif;">

    <!-- Deep Space Nebula Wash Background -->
    <div class="absolute inset-0 z-0 bg-radial-at-c from-[#0b132b]/40 via-[#030712]/80 to-[#020408] pointer-events-none"></div>

    <!-- Directional Vignette for Cockpit Depth -->
    <div class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_center,transparent_0%,rgba(2,4,8,0.7)_70%,rgba(0,0,0,0.95)_100%)] pointer-events-none"></div>

    <!-- Hyperspace Canvas Overlay -->
    <canvas id="particle-canvas" class="absolute inset-0 w-full h-full z-20 pointer-events-none"></canvas>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 420; // Dense, vivid star count
        const speedMultiplier = 3.2; // Fast warp speed spaceship velocity

        let originX, originY;
        let targetOriginX, targetOriginY;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = Math.max(1, Math.floor(width * dpr));
            canvas.height = Math.max(1, Math.floor(height * dpr));
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = true;
            
            originX = width / 2;
            originY = height / 2;
            targetOriginX = originX;
            targetOriginY = originY;
        }

        // Subtle flight control / steering parallax on mouse movement
        window.addEventListener('mousemove', (e) => {
            targetOriginX = (width / 2) + (e.clientX - width / 2) * 0.06;
            targetOriginY = (height / 2) + (e.clientY - height / 2) * 0.06;
        });

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                // Radial 3D distribution centered around flight path
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.pow(Math.random(), 0.65) * (Math.max(width, height) * 0.85 + 200);
                
                this.x = Math.cos(angle) * radius;
                this.y = Math.sin(angle) * radius;
                
                this.z = initial ? Math.random() * 1000 : 1000;
                this.speed = (Math.random() * 6 + 4) * speedMultiplier;
                
                // Varied luminous star spectral classes (White, Electric Cyan, Azure, Soft Violet, Golden)
                const rand = Math.random();
                if (rand > 0.6) {
                    this.color = '255, 255, 255'; // Pure Diamond White
                } else if (rand > 0.3) {
                    this.color = '96, 165, 250'; // Electric Azure Blue
                } else if (rand > 0.15) {
                    this.color = '56, 189, 248'; // Bright Cyan
                } else if (rand > 0.05) {
                    this.color = '192, 132, 252'; // Cosmic Purple
                } else {
                    this.color = '253, 224, 71'; // Warm Golden Star
                }

                this.length = Math.random() * 3.5 + 2.0; // Long warp streaks
            }

            update() {
                const speed = (window.__SF_CONTROLS && window.__SF_CONTROLS.speed != null)
                    ? window.__SF_CONTROLS.speed
                    : 1;

                this.z -= this.speed * speed;
                if (this.z <= 1) {
                    this.reset(false);
                }
            }

            draw() {
                const fov = 320;
                
                const scale = fov / this.z;
                const px = originX + this.x * scale;
                const py = originY + this.y * scale;

                // Off-screen check
                if (px < -150 || px > width + 150 || py < -150 || py > height + 150) {
                    this.reset(false);
                    return;
                }

                // Warp trailing line calculation
                const prevZ = this.z + (this.speed * this.length * 1.4);
                const prevScale = fov / prevZ;
                const prevPx = originX + this.x * prevScale;
                const prevPy = originY + this.y * prevScale;

                // Progressive bold opacity as stars rush towards viewer
                const proximity = 1 - (this.z / 1000);
                let opacity = Math.min(1, proximity * 1.5);
                if (this.z > 900) opacity *= (1000 - this.z) / 100;

                // Draw warp light trail streak
                ctx.beginPath();
                ctx.moveTo(prevPx, prevPy);
                ctx.lineTo(px, py);
                
                ctx.strokeStyle = `rgba(${this.color}, ${opacity * 0.95})`;
                // Thicker, bolder warp trails
                ctx.lineWidth = Math.max(0.6, Math.min(4.0, proximity * 3.2));
                ctx.lineCap = 'round';
                ctx.stroke();

                // Draw glowing luminous star head for stars near camera
                if (this.z < 650) {
                    const headRadius = Math.max(0.8, proximity * 2.4);
                    ctx.beginPath();
                    ctx.arc(px, py, headRadius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    ctx.fill();
                }
            }
        }

        function init() {
            resize();
            window.addEventListener('resize', resize);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth parallax flight tracking
            originX += (targetOriginX - originX) * 0.05;
            originY += (targetOriginY - originY) * 0.05;

            // Semi-transparent clearing creates hyper-drive motion blur streaks
            ctx.fillStyle = 'rgba(3, 5, 10, 0.34)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
        }

        init();
    </script>
</body>
</html>
